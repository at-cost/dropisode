name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reel_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/reel_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core never imports apps or billing
        run: node scripts/check-boundaries.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @reel/studio build
      - name: PostgreSQL 16 client tools (match the server; newer pg_dump output may not restore into 16)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - run: pnpm test
      - name: Install the browser for the journey test
        run: pnpm --filter @reel/hosted exec playwright install --with-deps chromium-headless-shell
      - name: Customer journey in a real browser (providers and Stripe mocked)
        run: pnpm --filter @reel/hosted exec vitest run -c vitest.e2e.config.ts
      - name: Journey test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: apps/hosted/e2e/.artifacts/
          if-no-files-found: ignore
