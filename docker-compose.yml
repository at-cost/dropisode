# Reel hosted on one small server: cp apps/hosted/.env.example .env, fill it in, then `docker compose up -d`.
# Postgres is the only stateful service; media lives in Cloudflare R2.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reel -d reel"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    logging: *logging
    build: .
    image: reel-hosted:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://reel:${POSTGRES_PASSWORD}@postgres:5432/reel}
    ports:
      - "${HOST_PORT:-3200}:3200"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
